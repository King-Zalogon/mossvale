name: CI

# GitHub Actions is DISABLED by owner decision (2026-11-11). The local gate is authoritative:
# `npm run gate` records evidence per commit under docs/handoffs/evidence/ and `npm run gate:check` enforces it.
# This workflow stays so that enabling Actions is a one-click option; it runs the same gate, once, on Ubuntu.
# Windows coverage remains a local responsibility and is recorded in gate evidence.
on:
  pull_request:
    branches: [integration, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Local gate (the evidence file is not committed from CI)
        run: npm run gate
