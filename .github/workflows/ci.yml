name: CI

# Runs existing checks on pushes and PRs; integration PRs additionally enforce catalogue impact.
# Required-check settings remain repository administration; never bypass failed checks.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Catalogue documentation impact
        if: github.event_name == 'pull_request'
        run: npm run catalogue:impact -- --base origin/integration
      - name: Lint, format, asset manifest, module boundaries and unit tests
        run: npm run check
      - name: Install Chromium for browser smoke tests (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium for browser smoke tests (Windows)
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Browser smoke tests
        run: npm run test:browser
      - name: Package a traceable build
        run: npm run build
      - name: Verify authenticated account APIs with a local Supabase fixture
        run: npm run test:account-api
      - name: Keep the build for this commit
        uses: actions/upload-artifact@v4
        with:
          name: mossvale-${{ github.sha }}-${{ matrix.os }}
          path: build/
          retention-days: 90
